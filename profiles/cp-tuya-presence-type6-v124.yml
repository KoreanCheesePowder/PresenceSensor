name: cp-tuya-presence-type6-v124
components:
  - id: main
    capabilities:
      - id: presenceSensor
        version: 1
      - id: motionSensor
        version: 1
      - id: battery
        version: 1
      - id: refresh
        version: 1
      - id: buildbook37604.driverInformation
        version: 1
    categories:
      - name: PresenceSensor

preferences:
  - name: type6FadingTime
    title: 재실 유지시간
    description: 부재 전환 지연 시간(초)
    required: false
    preferenceType: integer
    definition:
      minimum: 10
      maximum: 28800
      default: 30

  - name: type6DetectionDistance
    title: 감지 거리
    description: 레이더 감지 범위(미터)
    required: false
    preferenceType: number
    definition:
      minimum: 0.0
      maximum: 5.0
      default: 5.0

  - name: type6StaticSensitivity
    title: 정적 감지 민감도
    description: 정적인 사람 감지 민감도(0~10)
    required: false
    preferenceType: integer
    definition:
      minimum: 0
      maximum: 10
      default: 8

  - name: type6MotionSensitivity
    title: 동적 감지 민감도
    description: 움직이는 사람 감지 민감도(0~10)
    required: false
    preferenceType: integer
    definition:
      minimum: 0
      maximum: 10
      default: 8

  - name: type6Indicator
    title: LED 표시기
    description: LED 표시 기능
    required: false
    preferenceType: enumeration
    definition:
      options:
        "ON": "켜기"
        "OFF": "끄기"
      default: "ON"

  - name: type6AntiInterference
    title: 간섭 방지
    description: 레이더 간섭 방지 기능
    required: false
    preferenceType: enumeration
    definition:
      options:
        "ON": "켜기"
        "OFF": "끄기"
      default: "OFF"
