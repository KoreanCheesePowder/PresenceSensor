name: cp-tuya-presence-type6-v125
components:
  - id: main
    capabilities:
      - id: presenceSensor
        version: 1
      - id: motionSensor
        version: 1
      - id: battery
        version: 1
      - id: refresh
        version: 1
      - id: buildbook37604.driverInformation
        version: 1
    categories:
      - name: PresenceSensor

preferences:
  - name: type6FadingTime
    title: 재실 유지시간
    description: 부재 전환 지연 시간(초)
    required: false
    preferenceType: integer
    definition:
      minimum: 10
      maximum: 28800
      default: 30

  - name: type6DetectionDistance
    title: 감지 거리
    description: 레이더 감지 범위(미터)
    required: false
    preferenceType: number
    definition:
      minimum: 0.0
      maximum: 5.0
      default: 5.0

  - name: type6StaticSensitivity
    title: 정적 감지 민감도
    description: 정적인 사람 감지 민감도(0~10)
    required: false
    preferenceType: integer
    definition:
      minimum: 0
      maximum: 10
      default: 8

  - name: type6MotionSensitivity
    title: 동적 감지 민감도
    description: 움직이는 사람 감지 민감도(0~10)
    required: false
    preferenceType: integer
    definition:
      minimum: 0
      maximum: 10
      default: 8

  - name: type6Indicator
    title: LED 표시기
    description: LED 표시 기능
    required: false
    preferenceType: enumeration
    definition:
      options:
        "ON": "켜기"
        "OFF": "끄기"
      default: "ON"

  - name: type6AntiInterference
    title: 간섭 방지
    description: 레이더 간섭 방지 기능
    required: false
    preferenceType: enumeration
    definition:
      options:
        "ON": "켜기"
        "OFF": "끄기"
      default: "OFF"

  - name: type6CommTimeout
    title: 통신 무응답 판정 시간
    description: Zigbee 수신이 없을 때 통신 끊김 의심으로 표시할 시간(분). 절전 센서는 오판 가능
    required: false
    preferenceType: integer
    definition:
      minimum: 15
      maximum: 360
      default: 60

  - name: type6ClearOnTimeout
    title: 통신 무응답 시 감지 초기화
    description: ON이면 수신이 끊긴 후 재실/동작을 해제하며 부재 루틴이 실행될 수 있음
    required: false
    preferenceType: enumeration
    definition:
      options:
        "ON": "초기화 (부재 루틴 실행 가능)"
        "OFF": "감지값 유지 (통신 상태만 표시)"
      default: "ON"
